name: Three.js quick preview sanity

on:
  push:
    branches: [main, fix/three-xml-security-025]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source without importing QGIS
        run: python -m compileall -q view_to_paraview scripts
      - name: Test lightweight geometry preview (no QGIS, VTK or network)
        run: python -m unittest discover -s view_to_paraview/qa -p 'test_three_preview.py' -v
      - name: Bandit security scan (runtime plugin files)
        run: |
          python -m pip install --disable-pip-version-check -q bandit==1.8.6
          python -m bandit -q -r view_to_paraview -x view_to_paraview/qa
      - name: Validate complete QGIS release ZIP without importing QGIS
        run: |
          python scripts/build_release.py /tmp/CurrentView_by_GroundSurf_0.2.5.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path('/tmp/CurrentView_by_GroundSurf_0.2.5.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names = set(z.namelist())
              assert 'view_to_paraview/three_preview.py' in names
              assert 'view_to_paraview/LICENSE' in names
              m = z.read('view_to_paraview/metadata.txt').decode()
              assert 'name=Current View to ParaView by GroundSurf' in m
              assert 'version=0.2.5' in m
          print('Validated ZIP:', p.stat().st_size, 'bytes')
          PY
      - name: Upload experimental QGIS plugin ZIP for manual desktop testing
        uses: actions/upload-artifact@v4
        with:
          name: CurrentView_to_ParaView_by_GroundSurf_0.2.5_trial
          path: /tmp/CurrentView_by_GroundSurf_0.2.5.zip
          if-no-files-found: error
          retention-days: 7
